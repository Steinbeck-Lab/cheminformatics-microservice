services:
  mcp:
    # The bundled SURGE release is an x86-64 Linux executable.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.lite
    container_name: cheminformatics-microservice-mcp
    ports:
      - "${MCP_BIND_ADDRESS:-0.0.0.0}:${MCP_PORT:-8002}:80"
    environment:
      - HOMEPAGE_URL=/docs
      - RELEASE_VERSION=0.1.0
      - WORKERS=1
      - INCLUDE_OCSR=false
      - ENABLE_MCP=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true